description: >-
  Life Biosciences is a Boston-based, clinical-stage biotechnology company developing therapeutics
  that target the biology of aging. Its platform — which the company calls epigenetic restoration,
  a partial epigenetic reprogramming (PER) approach using the OCT4, SOX2 and KLF4 transcription
  factors — is designed to return older and damaged cells to a younger, healthier functional state.
  Its lead program, ER-100, is in a Phase 1 first-in-human study in optic neuropathies (open-angle
  glaucoma and non-arteritic anterior ischemic optic neuropathy) following FDA clearance of the IND
  in January 2026, with a preclinical program in metabolic dysfunction-associated steatohepatitis
  (MASH) behind it. The company is privately held, has raised an $80M Series D, and trades on
  secondary markets. Life Biosciences publishes no developer program, API documentation or SDKs;
  the only machine-readable surface reachable on its corporate site is the read-only WordPress REST
  content API, which serves its press releases, pages, media and taxonomies as JSON.
